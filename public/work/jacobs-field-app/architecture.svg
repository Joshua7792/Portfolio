<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 738" role="img" aria-labelledby="t d">
<title id="t">Jacobs Field APP architecture</title>
<desc id="d">Dashboard exports feed a TypeScript importer CLI with a fidelity oracle, which writes to Supabase Postgres through the service role. The Expo app signs in with MFA, then reads through supabase-js under row-level security, with realtime refresh. CI wraps the whole repo: typecheck, lint, unit tests, pgTAP, end-to-end tests and a secret scan.</desc>
