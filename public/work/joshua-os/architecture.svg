<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 738" role="img" aria-labelledby="t d">
<title id="t">Joshua-OS architecture</title>
<desc id="d">AGENTS.md and nine rule files load into every session. The SOP runs left to right: coordinate, plan, build, verify, ship, learn. Build fans out into parallel worktree lanes with one builder agent each, merging to main behind a backup ref; verify routes to reviewer agents; learn writes to lessons and memory. Each project keeps one todo file.</desc>
