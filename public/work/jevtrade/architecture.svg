<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 738" role="img" aria-labelledby="t d">
<title id="t">JevTrade architecture</title>
<desc id="d">A cached market-data store feeds two packages. The lab runs strategies through walk-forward, purge and the sealed vault. The jevtest package builds anonymised snapshots, asks Jev typed questions, caches the answers and scores them against baselines with bootstrap confidence intervals. AST-checked walls separate both packages from the paper-order code. Results land in an append-only notebook.</desc>
