<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 738" role="img" aria-labelledby="t d">
<title id="t">Jacobs reporting platform architecture</title>
<desc id="d">Ten source workbook roles flow through three paths: the reports ETL, the safety and quality extractors, and FastAPI readers run in-process. All three write JSON, which is baked into JS data files. One static HTML page renders 26 views from them.</desc>
