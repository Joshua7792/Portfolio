<rect x="48" y="100" width="230" height="120" rx="4" fill="#E8DDC8" stroke="#0F1A14" stroke-width="1.5"/>
<text x="163.0" y="142.9" text-anchor="middle" font-size="18" fill="#0F1A14">Cost report,</text>
<text x="163.0" y="166.3" text-anchor="middle" font-size="18" fill="#0F1A14">6-column P6 export</text>
<text x="163.0" y="189.7" text-anchor="middle" font-size="18" fill="#0F1A14">milestones</text>
<rect x="322" y="100" width="250" height="120" rx="4" fill="#E8DDC8" stroke="#0F1A14" stroke-width="1.5"/>
